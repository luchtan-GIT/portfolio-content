name: Trigger portfolio build

on:
  push:
    branches: [main]

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch to portfolio-site
        run: |
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.QUARTZ_DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/luchtan-GIT/portfolio-site/dispatches \
            -d '{"event_type":"content-updated"}'
